name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: create-release
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: books-tui
          target: ${{ matrix.target }}
          archive: $bin-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
      - if: contains(matrix.target, 'linux')
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - if: contains(matrix.target, 'linux')
        run: |
          deb=$(cargo deb --no-build --no-strip --target ${{ matrix.target }} | tail -n1)
          gh release upload "$GITHUB_REF_NAME" "$deb"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  arch-package:
    needs: upload-assets
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel pacman-contrib github-cli git
      - uses: actions/checkout@v4
      - run: |
          useradd -m builder
          cp -r packaging/aur /home/builder/pkg
          cd /home/builder/pkg
          sed -i "s/^pkgver=.*/pkgver=${GITHUB_REF_NAME#v}/; s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          chown -R builder .
          su builder -c "updpkgsums && makepkg --noconfirm"
          gh release upload "$GITHUB_REF_NAME" ./*.pkg.tar.zst
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
