[package]
name = "books-tui"
version = "0.1.1"
edition = "2021"
rust-version = "1.88"
description = "Browse, fuzzy-search, and open your PDF library from the terminal"
license = "MIT"
repository = "https://github.com/Prakhil-tp/books-tui"
homepage = "https://github.com/Prakhil-tp/books-tui"
readme = "README.md"
keywords = ["tui", "pdf", "terminal", "ebook", "library"]
categories = ["command-line-utilities"]
exclude = ["legacy/", "assets/", ".github/", "tests/"]

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "5"
notify = "6"
notify-debouncer-full = "0.3"
nucleo-matcher = "0.3"
ratatui = "0.29"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
unicode-width = "0.2"
wait-timeout = "0.2"

[dev-dependencies]
assert_cmd = "2"
insta = { version = "1", features = ["yaml"] }
tempfile = "3"

[package.metadata.deb]
maintainer = "Prakhil TP <20636485+Prakhil-tp@users.noreply.github.com>"
copyright = "2026, Prakhil TP"
section = "utils"
priority = "optional"
recommends = "zathura, poppler-utils"
extended-description = "Browse, fuzzy-search, and open your PDF library from the terminal."
assets = [
    ["target/release/books-tui", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/books-tui/README", "644"],
]
